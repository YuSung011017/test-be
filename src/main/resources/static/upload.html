<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>사진 업로드 및 AI 분석</title>
</head>
<body>
<h2>사진 업로드</h2>
<input type="file" id="fileInput" />
<button onclick="upload()">Upload</button>

<h3>AI 분석 결과</h3>
<pre id="result"></pre>

<script>
    async function upload() {
        const file = document.getElementById("fileInput").files[0];
        if (!file) {
            alert("파일을 선택해주세요.");
            return;
        }

        try {
            // 1단계: Spring Boot에 presigned URL 요청
            const res = await fetch("/upload", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: `fileName=${file.name}&contentType=${file.type}`
            });
            const data = await res.json();

            // 2단계: S3에 직접 파일 업로드
            await fetch(data.presignedUrl, {
                method: "PUT",
                headers: { "Content-Type": file.type },
                body: file
            });

            // 3단계: Spring Boot → FastAPI로 presigned URL 전달
            const notifyRes = await fetch("/notify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: data.presignedUrl.split('?')[0] })
            });

            const notifyData = await notifyRes.json();

            // 4단계: 결과 출력
            document.getElementById("result").textContent = JSON.stringify(notifyData, null, 2);
        } catch (err) {
            document.getElementById("result").textContent = "에러 발생: " + err.message;
        }
    }
</script>
</body>
</html>
